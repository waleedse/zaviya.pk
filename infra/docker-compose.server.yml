# Zaviya on its own VPS (Contabo EU, 194.163.184.12): everything in Docker, behind the host's nginx.
# Lives at /var/www/aurm-test/app; secrets in /var/www/aurm-test/env (never in git).
#   docker compose -f infra/docker-compose.server.yml --env-file ../env/compose.env up -d --build
# Ports are bound to 127.0.0.1 only: nginx on the host terminates TLS and proxies in.
# The web app is NOT here: it runs blue/green from docker-compose.web.yml (ports 3100/3101)
# so releases switch over with zero downtime (see infra/scripts/deploy.sh).
name: zaviya

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaviya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: zaviya
    ports:
      # Build-time pre-rendering reaches the database through the host network
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zaviya']
      interval: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  worker:
    image: zaviya-worker:${RELEASE:-latest}
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    # PID 1 that reaps children: chromium/esbuild/tsc exits left ~100 zombie processes on the host (ZAV-187)
    init: true
    env_file: ${ENV_DIR:-../../env}/worker.env
    environment:
      PAYLOAD_URL: http://web:3000
      PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_SITE_URL}
      REDIS_URL: redis://redis:6379
      BRIDGE_HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      # The Chrome extension reaches this through nginx (wss://<host>/bridge)
      - '127.0.0.1:8787:8787'
    depends_on:
      redis:
        condition: service_healthy

  agents:
    image: zaviya-agents:${RELEASE:-latest}
    build:
      context: ..
      dockerfile: infra/agents.Dockerfile
    restart: unless-stopped
    init: true
    env_file: ${ENV_DIR:-../../env}/agents.env
    environment:
      PAYLOAD_URL: http://web:3000
      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    volumes:
      - agentdata:/data
    # Watchdog + one CLI agent run at a time: keep it small next to the web app
    mem_limit: 1g

  # Daily videos: rendering is CPU heavy, so it lives in its own container with hard limits and can never slow the
  # news worker. Off until VIDEO_ENABLED=true in compose.env (it just idles). Rollback: VIDEO_ENABLED=false, or
  # `docker stop zaviya-video-1`. It only SENDS to Telegram (the main worker owns the long poll).
  video:
    image: zaviya-video:${RELEASE:-latest}
    build:
      context: ..
      dockerfile: infra/video.Dockerfile
    restart: unless-stopped
    init: true
    env_file: ${ENV_DIR:-../../env}/worker.env
    environment:
      PAYLOAD_URL: http://web:3000
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      VIDEO_ENABLED: ${VIDEO_ENABLED:-false}
      VIDEO_SLOTS: ${VIDEO_SLOTS:-}
      VIDEO_PLATFORMS: ${VIDEO_PLATFORMS-instagram,facebook}
      VIDEO_VETO_MIN: ${VIDEO_VETO_MIN:-20}
      # Urdu voice for the headline videos, made on the Mac; the hub is reached through nginx on the sslip.io host
      VIDEO_VOICED: ${VIDEO_VOICED:-false}
      # an Urdu explainer video every 3 hours, voice and pictures made on the Mac
      VIDEO_EXPLAINER: ${VIDEO_EXPLAINER:-false}
      MEDIA_HUB_PORT: 8790
    ports:
      - 127.0.0.1:8790:8790
    volumes:
      - videodata:/data/videos
    cpus: 2
    mem_limit: 3g
    depends_on:
      redis:
        condition: service_healthy

volumes:
  agentdata:
  pgdata:
  redisdata:
  videodata:
