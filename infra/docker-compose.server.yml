# Zaviya on the shared VPS (209.58.160.74): everything in Docker, behind the host's nginx.
# Lives at /var/www/aurm-test/app; secrets in /var/www/aurm-test/env (never in git).
#   docker compose -f infra/docker-compose.server.yml --env-file ../env/compose.env up -d --build
# Ports are bound to 127.0.0.1 only: nginx on the host terminates TLS and proxies in.
# The host already serves other sites on 3000, so the web app uses 3100.
name: zaviya

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaviya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: zaviya
    ports:
      # Build-time pre-rendering reaches the database through the host network
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zaviya']
      interval: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  web:
    image: zaviya-web:${RELEASE:-latest}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      network: host
      args:
        BUILD_DATABASE_URL: postgres://zaviya:${POSTGRES_PASSWORD}@127.0.0.1:5434/zaviya
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_CHANNEL_URL: ${NEXT_PUBLIC_WHATSAPP_CHANNEL_URL:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
    restart: unless-stopped
    env_file: ${ENV_DIR:-../../env}/web.env
    environment:
      DATABASE_URL: postgres://zaviya:${POSTGRES_PASSWORD}@postgres:5432/zaviya
      NODE_ENV: production
    ports:
      - '127.0.0.1:3100:3000'
    volumes:
      - media:/app/apps/web/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/robots.txt').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 10

  worker:
    image: zaviya-worker:${RELEASE:-latest}
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    env_file: ${ENV_DIR:-../../env}/worker.env
    environment:
      PAYLOAD_URL: http://web:3000
      PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_SITE_URL}
      REDIS_URL: redis://redis:6379
      BRIDGE_HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      # The Chrome extension reaches this through nginx (wss://<host>/bridge)
      - '127.0.0.1:8787:8787'
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
