# Host nginx site for Zaviya on its own VPS (Contabo EU, 194.163.184.12): /etc/nginx/sites-available/zaviya
# Certificate (Let's Encrypt, certbot renews it) covers zaviya.pk, www and the sslip.io fallback host.
#   certbot --nginx --expand -d zaviya.pk -d www.zaviya.pk -d zaviya.194-163-184-12.sslip.io
# Cloudflare proxies zaviya.pk; keep its SSL/TLS mode on "Full (strict)".
map $http_upgrade $zaviya_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name zaviya.pk;
    ssl_certificate /etc/letsencrypt/live/zaviya.209-58-160-74.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaviya.209-58-160-74.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Chrome extension bridge (token-authenticated WebSocket into the worker)
    location /bridge {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zaviya_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://zaviya_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zaviya_connection_upgrade;
    }
}

# www redirects to the canonical domain
server {
    listen 443 ssl;
    server_name www.zaviya.pk;
    ssl_certificate /etc/letsencrypt/live/zaviya.209-58-160-74.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaviya.209-58-160-74.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://zaviya.pk$request_uri;
}

# The sslip.io host reaches the server directly (not through Cloudflare, which resets the Chrome
# extension's WebSocket). It serves only the extension bridge; everything else redirects.
server {
    listen 443 ssl;
    server_name zaviya.194-163-184-12.sslip.io;
    ssl_certificate /etc/letsencrypt/live/zaviya.194-163-184-12.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaviya.194-163-184-12.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /bridge {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zaviya_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Media hub for the Mac agent (token-authenticated HTTPS long polling into the video service)
    location /media/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 50M;
        proxy_read_timeout 60s;
    }

    location / {
        return 301 https://zaviya.pk$request_uri;
    }
}

server {
    listen 80;
    server_name mail.zaviya.pk zaviya.pk www.zaviya.pk zaviya.194-163-184-12.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://zaviya.pk$request_uri; }
}
