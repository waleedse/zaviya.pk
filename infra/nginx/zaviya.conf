# Host nginx site for Zaviya on the shared VPS: /etc/nginx/sites-available/zaviya
# certbot --nginx adds the TLS lines. When zaviya.pk DNS points here, add it to server_name,
# run certbot again for it, and drop the noindex header.
map $http_upgrade $zaviya_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name zaviya.209-58-160-74.sslip.io;

    client_max_body_size 50M;

    # Temporary host: keep it out of search results until the real domain is live.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Chrome extension bridge (token-authenticated WebSocket into the worker)
    location /bridge {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zaviya_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zaviya_connection_upgrade;
    }
}
