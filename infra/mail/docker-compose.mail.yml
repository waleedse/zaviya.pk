# Mail for @zaviya.pk (docker-mailserver: Postfix + Dovecot), its own compose project so it never
# touches the web, worker or database containers.
#   cd /var/www/aurm-test/app && docker compose -f infra/mail/docker-compose.mail.yml up -d
# Mailboxes:  docker exec zaviya-mail setup email add contact@zaviya.pk '<password>'
# DKIM:       docker exec zaviya-mail setup config dkim  (then publish mail._domainkey TXT in Cloudflare)
# DNS (Cloudflare, all "DNS only", never proxied):
#   A    mail.zaviya.pk -> 194.163.184.12
#   MX   zaviya.pk      -> mail.zaviya.pk (10)
#   TXT  zaviya.pk      "v=spf1 ip4:194.163.184.12 mx -all"
#   TXT  _dmarc         "v=DMARC1; p=quarantine; rua=mailto:postmaster@zaviya.pk"
# TLS comes from the host's certbot (webroot via host nginx): certbot certonly --webroot -w /var/www/html -d mail.zaviya.pk
# Outlook / phone: IMAP mail.zaviya.pk:993 (SSL), SMTP mail.zaviya.pk:587 (STARTTLS), user = full address.
name: zaviya-mail

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:15
    container_name: zaviya-mail
    hostname: mail.zaviya.pk
    restart: unless-stopped
    ports:
      - '25:25'
      - '465:465'
      - '587:587'
      - '993:993'
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - mailconfig:/tmp/docker-mailserver
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      SSL_TYPE: ${MAIL_SSL_TYPE:-letsencrypt}
      # Small server shared with the web app: keep the heavy scanners off
      ENABLE_CLAMAV: 0
      ENABLE_AMAVIS: 0
      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_FAIL2BAN: 1
      ENABLE_POP3: 0
      ENABLE_IMAP: 1
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: 1
      POSTMASTER_ADDRESS: postmaster@zaviya.pk
      ONE_DIR: 1
    cap_add:
      - NET_ADMIN
    mem_limit: 768m
    stop_grace_period: 1m

volumes:
  maildata:
  mailstate:
  maillogs:
  mailconfig:
