name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub-hosted only: pull requests must never reach the self-hosted server runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @zaviya/shared --filter @zaviya/llm --filter @zaviya/worker --filter @zaviya/web run typecheck
      - name: Unit tests
        run: pnpm --filter @zaviya/llm --filter @zaviya/worker run test
