name: Auto release
# Merges agent PRs (branch agent/*) once CI is green and the Linear issue has `pm-approved`
# (and not `risk-high`), then releases them through the zero-downtime Deploy workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ops/bin/auto-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
