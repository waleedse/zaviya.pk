name: Deploy
# A release tag (v2026.10.11-1) deploys that exact commit to the server.
#   gh release create v2026.10.11-1 --generate-notes
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zaviya-server]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build, switch and health-check (rolls back on failure)
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: bash infra/scripts/deploy.sh "$RELEASE_REF"
