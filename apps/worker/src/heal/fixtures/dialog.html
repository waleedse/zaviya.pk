<!doctype html><html><head><meta charset="utf-8"><title>Home / Social</title>
<style>body{font:16px system-ui;margin:0;background:#fff}.feed{max-width:560px;margin:0 auto;padding:16px}.post{border-bottom:1px solid #ddd;padding:12px 0}
.back{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.dlg{background:#fff;border-radius:16px;padding:24px;width:320px}
.dlg button{display:block;width:100%;margin-top:10px;padding:10px;border-radius:20px;border:1px solid #999;background:#fff;font-size:15px}.dlg .primary{background:#111;color:#fff}
#postbtn{position:fixed;right:24px;bottom:24px;padding:12px 24px;border-radius:24px;background:#1d9bf0;color:#fff;border:0}</style></head><body>
<div class="feed"><div class="post"><b>@newsdesk</b><p>Markets open higher.</p></div><div class="post"><b>@weather</b><p>Heat advisory for Lahore.</p></div></div>
<button id="postbtn">Post</button>
<div class="back"><div class="dlg" role="dialog" aria-modal="true"><h2>Turn on notifications?</h2><p>Get alerts for new posts from accounts you follow.</p>
<button class="primary">Turn on</button><button>Not now</button></div></div></body></html>
